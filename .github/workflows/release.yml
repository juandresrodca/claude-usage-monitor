name: Build & release

on:
  push:
    tags:
      - 'v*'        # e.g. v0.1.0
  workflow_dispatch:  # allow manual runs from the Actions tab

permissions:
  contents: write   # needed to attach binaries to the GitHub Release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v',''
          } else {
            [xml]$csproj = Get-Content ClaudeUsageMonitor.csproj
            $v = ($csproj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $v"

      - name: Publish self-contained EXE
        shell: pwsh
        run: pwsh build/publish.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Zip portable build
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $src = "dist/ClaudeUsageMonitor-$v-win-x64"
          $zip = "dist/ClaudeUsageMonitor-$v-win-x64.zip"
          Compress-Archive -Path "$src/*" -DestinationPath $zip -Force
          Write-Host "Wrote $zip"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: pwsh build/build-installer.ps1 -Version ${{ steps.ver.outputs.version }} -SkipPublish

      - name: Upload artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageMonitor-${{ steps.ver.outputs.version }}
          path: |
            dist/ClaudeUsageMonitor-${{ steps.ver.outputs.version }}-win-x64.zip
            dist/ClaudeUsageMonitor-${{ steps.ver.outputs.version }}-Setup.exe

      - name: Attach to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Claude Usage Monitor ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/ClaudeUsageMonitor-${{ steps.ver.outputs.version }}-win-x64.zip
            dist/ClaudeUsageMonitor-${{ steps.ver.outputs.version }}-Setup.exe
